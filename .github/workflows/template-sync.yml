name: Template Synchronization

on:
  schedule:
    # At 00:00 on Thursday.
    - cron: "0 0 * * 4"
  # manual trigger
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actions-template-sync
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: movestore/Template_R_Shiny_App
